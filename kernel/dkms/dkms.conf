# DKMS template for L2+L3 hardened amdxdna (dragon-npu L4).
#
# This file is a **template**. It does not vendor the full amd/xdna-driver
# sources. Use hooks/prepare_from_clone.sh to stage a patched clone, then
# adjust PACKAGE_NAME / PACKAGE_VERSION / BUILT_MODULE_NAME paths to match
# the xdna-driver layout you checked out.
#
# Documented base SHA for dragon-npu patches:
#   905717f5cd470580054a1635b9eea24b84dfd67f
#
# After prepare_from_clone.sh, typical flow (root):
#   sudo dkms add -m amdxdna-hardened -v 0.1.0
#   sudo dkms build -m amdxdna-hardened -v 0.1.0 -k "$(uname -r)"
#   sudo dkms install -m amdxdna-hardened -v 0.1.0 -k "$(uname -r)"
#
# Uninstall:
#   sudo dkms remove -m amdxdna-hardened -v 0.1.0 --all
#
# Honesty: destination module name may collide with in-tree/distro `amdxdna`.
# Prefer install only after clean boot and modprobe -r of the stock module
# when unused. Never rmmod -f over a WEDGED host.

PACKAGE_NAME="amdxdna-hardened"
PACKAGE_VERSION="0.1.0"

# Module built from staged source (relative to DKMS source tree after prepare).
# xdna-driver lays out the kmod under src/driver/amdxdna/ — adjust if your
# release uses a different path or a CMake-generated out-of-tree build.
BUILT_MODULE_NAME[0]="amdxdna"
BUILT_MODULE_LOCATION[0]="src/driver/amdxdna"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Prefer the project's own build if prepare wrote a Makefile wrapper.
# Default MAKE uses kernel kbuild against the amdxdna directory. This often
# needs config_kernel.h from xdna-driver tools — run prepare_from_clone.sh
# which documents / attempts configure_kernel.sh when present.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/driver/amdxdna modules"
CLEAN[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/driver/amdxdna clean"

# Lab/hardened default: do NOT auto-rebuild on every kernel upgrade.
# Failed or partial autoinstall against a stub MAKE[] is an ops hazard and
# DEST name `amdxdna` can collide with distro/in-tree modules. Enable only
# after a verified first manual build:
#   AUTOINSTALL="yes"
AUTOINSTALL="no"

# Optional: only build for kernels that ship matching headers.
# BUILD_EXCLUSIVE_KERNEL is left unset for portability.

# MAKE[0] above is a bare-Kbuild stub. Prefer upstream xdna-driver CMake /
# package scripts; edit MAKE paths after prepare_from_clone.sh if needed.
