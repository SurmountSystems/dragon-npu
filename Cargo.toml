[package]
name = "earth-dragon-npu"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs ≥1.85; this crate also uses 1.87 APIs (`is_multiple_of`, `cast_unsigned`).
# Documented floor is 1.99, the stable this crate is built and tested on.
rust-version = "1.99"
authors = ["Dragonfire Project <contact@dragonfire.ai>"]
description = "Production-quality Rust library for vendor-agnostic NPU acceleration on Linux (AMD XDNA2 primary, simulation default; Intel/Hexagon honest stubs). Library-first rewrite with strict error handling."
license = "MIT"
repository = "https://github.com/dragonfire/dragon-npu"
keywords = ["npu", "ai", "acceleration", "linux", "inference"]
categories = ["science", "hardware-support"]
readme = "README.md"
# Keep crates.io tarball focused on the Rust crate + docs/patches story.
# Exclude Python reference trees, kmod build debris, host evidence, and large binaries.
# Docs needed for crate docs (README, docs/*.md, LICENSE) stay via default include.
exclude = [
    # Kernel build / OOT stage / rescue kmod (sources optional; debris never for crates.io)
    "kernel/out/",
    "kernel/dkms/staging/",
    "kernel/amdxdna_rescue/",
    # Host-local evidence snapshots
    "docs/upstream/evidence/",
    # Python reference implementation + scripts (not the Rust product)
    "dragon_npu/",
    "optimizations/",
    "benchmarks/",
    "setup.py",
    "requirements.txt",
    "pyproject.toml",
    "MANIFEST.in",
    "scripts/setup_npu.py",
    "examples/*.py",
    "tests/*.py",
    # Build artifacts / cargo target
    "target/",
    "**/*.ko",
    "**/*.o",
    "**/*.mod",
    "**/*.cmd",
    "**/Module.symvers",
    "**/modules.order",
    # Lab instruction / txn staging (never ship blobs)
    "testdata/xdna2_cmd/",
    "testdata/**/*.bin",
    "testdata/**/*.elf",
]

[lib]
name = "earth_dragon_npu"

[[bin]]
name = "earth-dragon-npu"
path = "src/bin/dragon_npu.rs"
doc = false

[[bench]]
name = "sim_compile_run"
harness = false

[[bench]]
name = "xdna2_direct"
harness = false
required-features = ["amd-xdna2"]

[dependencies]
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Real ONNX protobuf parsing (chosen after autonomous 2026 research spike).
# tract-onnx gives direct access to pb::ModelProto / GraphProto / NodeProto / TensorProto
# via prost, plus convenient loaders. This is the fastest path to replacing our JSON/.txt
# heuristics with real model loading (shapes, dtypes, weights, topology).
# See session research subagent output for alternatives (rten-onnx, oxionnx-proto) if we
# later want a leaner custom decoder.
# 0.23 drops liquid/anymap2 (RUSTSEC-2026-0319, unmaintained, no patched 0.22).
tract-onnx = "0.23.8"
# Must match tract-onnx 0.23, which generates pb types with prost 0.14.
prost = "0.14"

# Used only for the lightweight direct amdxdna driver path (under the amd-xdna2 feature).
# This keeps the direct implementation minimal and avoids pulling in heavier runtimes.
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Benchmarking and testing utilities (added when Phase 7 is reached)
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["simulation"]
simulation = []          # Always-available CPU fallback backend
amd-xdna2 = ["dep:libc"]   # AMD XDNA2 (Ryzen AI 300 / Strix Point & later) support — primary target for AMD backend work. Enables the lightweight direct driver (no heavy official runtimes).
# OFF by default on purpose (2026-07-13 incident): scaffold EXEC_CMD oops'd amdxdna
# (aie2_cmdlist_fill_slot) and wedged open(). NOT enabled by `amd-xdna2` alone.
# Even with this feature, runtime still requires XDNA2_ALLOW_EXEC_CMD=1.
# See docs/XDNA2_NEVER_AGAIN.md (L1 userspace permanent gate).
xdna2-dangerous-exec-cmd = []
# Secondary vendors: honest stubs only (available=false, run refuses). Not default.
# Not selected by DragonNpu::new. See docs/SECONDARY_BACKENDS.md.
intel-vpu = []           # Intel VPU (Meteor Lake+) — stub until XDNA2 MVP green
qualcomm-hexagon = []    # Qualcomm Hexagon (Snapdragon X) — stub; weakest Linux story
# Research-only XRT notes/capture comparison. NEVER default, NEVER enabled by amd-xdna2.
# No libxrt link, no EXEC_CMD, no production hot path. See docs/SECONDARY_BACKENDS.md.
xrt-bridge = []

[lints.rust]
unsafe_code = "deny"   # relaxed to "deny" only to allow a narrow, well-scoped unsafe ioctl module under the amd-xdna2 feature for the lightweight direct driver. All other code remains strictly safe.
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow common patterns in early incremental development
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Relax pedantic lints that are too strict for Phase 1 stubs and docs
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
# Expected when adding heavy crates like tract-onnx (brings older syn via build-deps or transitive)
multiple_crate_versions = "allow"
